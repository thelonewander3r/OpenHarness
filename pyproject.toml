[project]
name = "decomphose"
version = "0.1.0"
description = "Decomposition Harness — LLM API proxy (accuracy vs affordability)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.57.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28.0", "ruff>=0.8.0", "pytest>=8.0.0"]

[project.scripts]
decomphose = "decomphose.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decomphose"]

[tool.ruff]
line-length = 100
target-version = "py311"
